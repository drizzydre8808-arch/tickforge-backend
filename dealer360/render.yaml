services:
  - type: web
    name: dealer360-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DEALER360_API_KEY
        generateValue: true
      - key: DVLA_API_KEY
        sync: false
    disk: { name: data, mountPath: /data, sizeGB: 5 }
